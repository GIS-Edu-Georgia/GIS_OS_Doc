<!doctype html>
<html lang="ka"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIN და Delaunay</title>
<style>
:root{--bg:#fff;--fg:#1f2430;--mut:#6b7280;--line:#c7ccd6;--acc:#2563eb;--card:#f3f4f6;--hit:#e11d48}
@media (prefers-color-scheme:dark){:root{--bg:#1b1e27;--fg:#e5e7eb;--mut:#9ca3af;--line:#454b5c;--acc:#60a5fa;--card:#262a36;--hit:#fb7185}}
[data-theme=dark]{--bg:#1b1e27;--fg:#e5e7eb;--mut:#9ca3af;--line:#454b5c;--acc:#60a5fa;--card:#262a36;--hit:#fb7185}
[data-theme=light]{--bg:#fff;--fg:#1f2430;--mut:#6b7280;--line:#c7ccd6;--acc:#2563eb;--card:#f3f4f6;--hit:#e11d48}
*{box-sizing:border-box}body{margin:0;padding:8px;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc)}
canvas{width:100%;aspect-ratio:2/1;display:block;border:1px solid var(--line);border-radius:8px;touch-action:none}
.stats{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mut)}.stats b{color:var(--fg)}
</style></head><body>
<div class="bar">
 <button id="rnd">შემთხვევითი 40</button><button id="clr">გასუფთავება</button>
 <button id="cc" class="on">შემოხაზული წრე</button><button id="ed" class="on">წიბოები</button>
</div>
<canvas id="c" width="1000" height="500"></canvas>
<div class="stats">
 <span>წერტილები: <b id="n">0</b></span><span>სამკუთხედები: <b id="nt">0</b></span>
 <span>ინტერპოლირებული სიმაღლე: <b id="zi">–</b></span><span>ნამდვილი: <b id="zt">–</b></span>
 <span>დახრილობა: <b id="sl">–</b></span><span>ექსპოზიცია: <b id="as">–</b></span>
</div>
<p style="color:var(--mut);margin:6px 0 0">დააჭირეთ წერტილის დასამატებლად. ფერი სიმაღლეა, რომელსაც ფარული რელიეფი განსაზღვრავს. გადაატარეთ მაუსი სამკუთხედზე: წრეში სხვა წერტილი არ ხვდება (Delaunay-ს თვისება).</p>
<script>
/*CORE*/
function circ(a,b,c){const d=2*(a[0]*(b[1]-c[1])+b[0]*(c[1]-a[1])+c[0]*(a[1]-b[1]));if(d===0)return null;
 const a2=a[0]*a[0]+a[1]*a[1],b2=b[0]*b[0]+b[1]*b[1],c2=c[0]*c[0]+c[1]*c[1];
 const ux=(a2*(b[1]-c[1])+b2*(c[1]-a[1])+c2*(a[1]-b[1]))/d,uy=(a2*(c[0]-b[0])+b2*(a[0]-c[0])+c2*(b[0]-a[0]))/d;
 return[ux,uy,(a[0]-ux)**2+(a[1]-uy)**2]}
function delaunay(P){const n=P.length;if(n<3)return[];
 let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;for(const p of P){mnx=Math.min(mnx,p[0]);mxx=Math.max(mxx,p[0]);mny=Math.min(mny,p[1]);mxy=Math.max(mxy,p[1])}
 const mx=(mnx+mxx)/2,my=(mny+mxy)/2,d=Math.max(mxx-mnx,mxy-mny)*1000||1;
 const pts=[...P,[mx-d,my-d],[mx,my+d],[mx+d,my-d]];
 let tris=[{v:[n,n+1,n+2],c:circ(pts[n],pts[n+1],pts[n+2])}];
 for(let i=0;i<n;i++){const[px,py]=pts[i],bad=[],keep=[];
  for(const t of tris)((px-t.c[0])**2+(py-t.c[1])**2<t.c[2]?bad:keep).push(t);
  const ed=new Map();
  for(const t of bad){const v=t.v;for(const[a,b]of[[v[0],v[1]],[v[1],v[2]],[v[2],v[0]]]){const k=a<b?a+','+b:b+','+a;ed.set(k,(ed.get(k)||0)+1)}}
  for(const[k,c]of ed){if(c!==1)continue;const[a,b]=k.split(',').map(Number),cc=circ(pts[a],pts[b],pts[i]);if(cc)keep.push({v:[a,b,i],c:cc})}
  tris=keep}
 return tris.filter(t=>Math.max(...t.v)<n)}
function bary(p,a,b,c){const det=(b[1]-c[1])*(a[0]-c[0])+(c[0]-b[0])*(a[1]-c[1]);
 const l1=((b[1]-c[1])*(p[0]-c[0])+(c[0]-b[0])*(p[1]-c[1]))/det,l2=((c[1]-a[1])*(p[0]-c[0])+(a[0]-c[0])*(p[1]-c[1]))/det;return[l1,l2,1-l1-l2]}
function terrain(x,y){return 50+25*Math.sin(x/150)+20*Math.cos(y/90)+15*Math.sin((x+y)/110)}
/*END*/
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id),W=1000,H=500;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let P=[],Z=[],T=[],cur=null,showCC=true,showEd=true;
const col=z=>`hsl(${Math.max(0,Math.min(240,240-(z-15)*2.6))},60%,58%)`;
function add(x,y){P.push([x,y]);Z.push(terrain(x,y))}
function rebuild(){T=delaunay(P)}
function draw(){
 ctx.clearRect(0,0,W,H);
 for(const t of T){const[a,b,c]=t.v.map(i=>P[i]);ctx.fillStyle=col((Z[t.v[0]]+Z[t.v[1]]+Z[t.v[2]])/3);
  ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.closePath();ctx.fill();
  if(showEd){ctx.strokeStyle=css('--bg');ctx.lineWidth=1.2;ctx.stroke()}}
 ctx.fillStyle=css('--fg');P.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],3,0,7);ctx.fill()});
 let zi='–',zt='–',sl='–',as='–';
 if(cur){for(const t of T){const[a,b,c]=t.v.map(i=>P[i]),[l1,l2,l3]=bary(cur,a,b,c);
  if(Math.min(l1,l2,l3)>=0){zi=(l1*Z[t.v[0]]+l2*Z[t.v[1]]+l3*Z[t.v[2]]).toFixed(1);zt=terrain(cur[0],cur[1]).toFixed(1);
   if(showCC){ctx.strokeStyle=css('--hit');ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();ctx.arc(t.c[0],t.c[1],Math.sqrt(t.c[2]),0,7);ctx.stroke();ctx.setLineDash([])}
   ctx.strokeStyle=css('--hit');ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.closePath();ctx.stroke();
   const ux=b[0]-a[0],uy=-(b[1]-a[1]),uz=Z[t.v[1]]-Z[t.v[0]],vx=c[0]-a[0],vy=-(c[1]-a[1]),vz=Z[t.v[2]]-Z[t.v[0]];
   let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;if(nz<0){nx=-nx;ny=-ny;nz=-nz}
   sl=(Math.atan2(Math.hypot(nx,ny),nz)*180/Math.PI).toFixed(1)+'°';as=((Math.atan2(nx,ny)*180/Math.PI+360)%360).toFixed(0)+'°';break}}}
 $('n').textContent=P.length;$('nt').textContent=T.length;$('zi').textContent=zi;$('zt').textContent=zt;$('sl').textContent=sl;$('as').textContent=as}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
cv.addEventListener('pointerdown',e=>{const p=pos(e);add(p[0],p[1]);rebuild();draw()});
cv.addEventListener('pointermove',e=>{cur=pos(e);draw()});
cv.addEventListener('pointerleave',()=>{cur=null;draw()});
$('rnd').onclick=()=>{for(let i=0;i<40;i++)add(Math.random()*W,Math.random()*H);rebuild();draw()};
$('clr').onclick=()=>{P=[];Z=[];T=[];draw()};
$('cc').onclick=e=>{showCC=!showCC;e.target.classList.toggle('on',showCC);draw()};
$('ed').onclick=e=>{showEd=!showEd;e.target.classList.toggle('on',showEd);draw()};
function theme(){try{const t=parent.document.body.getAttribute('data-md-color-scheme');if(t)document.documentElement.dataset.theme=t==='slate'?'dark':'light'}catch(e){}draw()}
try{new MutationObserver(theme).observe(parent.document.body,{attributes:true,attributeFilter:['data-md-color-scheme']})}catch(e){}
theme();
</script></body></html>
