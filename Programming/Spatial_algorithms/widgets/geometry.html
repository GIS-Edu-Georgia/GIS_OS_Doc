<!doctype html>
<html lang="ka"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>გეომეტრიული ალგორითმები</title>
<style>
:root{--bg:#fff;--fg:#1f2430;--mut:#6b7280;--line:#c7ccd6;--acc:#2563eb;--card:#f3f4f6;--hit:#e11d48;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#1b1e27;--fg:#e5e7eb;--mut:#9ca3af;--line:#454b5c;--acc:#60a5fa;--card:#262a36;--hit:#fb7185;--ok:#4ade80}}
[data-theme=dark]{--bg:#1b1e27;--fg:#e5e7eb;--mut:#9ca3af;--line:#454b5c;--acc:#60a5fa;--card:#262a36;--hit:#fb7185;--ok:#4ade80}
[data-theme=light]{--bg:#fff;--fg:#1f2430;--mut:#6b7280;--line:#c7ccd6;--acc:#2563eb;--card:#f3f4f6;--hit:#e11d48;--ok:#16a34a}
*{box-sizing:border-box}body{margin:0;padding:8px;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc)}label{color:var(--mut)}input[type=range]{vertical-align:middle;width:140px}
canvas{width:100%;aspect-ratio:2/1;display:block;border:1px solid var(--line);border-radius:8px;touch-action:none}
.stats{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mut)}.stats b{color:var(--fg)}
.hide{display:none}
</style></head><body>
<div class="bar">
 <button id="m1" class="on">წერტილი პოლიგონში</button><button id="m2">Douglas–Peucker</button><button id="m3">ამოზნექილი გარსი</button>
 <span id="c2" class="hide"><label>ε <input id="eps" type="range" min="0" max="60" value="12" step="0.5"> <b id="epsv">12</b></label> <button id="newline">ახალი ხაზი</button></span>
 <span id="c3" class="hide"><button id="rnd">შემთხვევითი 30</button> <button id="clr">გასუფთავება</button></span>
</div>
<canvas id="c" width="1000" height="500"></canvas>
<div class="stats" id="s1"><span>გადაკვეთები სხივთან: <b id="cr">–</b></span><span>Winding number: <b id="wn">–</b></span><span>შედეგი: <b id="res">–</b></span></div>
<div class="stats hide" id="s2"><span>საწყისი წვეროები: <b id="n0">0</b></span><span>გამარტივებული: <b id="n1">0</b></span><span>შემცირება: <b id="red">0%</b></span></div>
<div class="stats hide" id="s3"><span>წერტილები: <b id="np">0</b></span><span>გარსის წვეროები: <b id="nh">0</b></span><span>ფართობი: <b id="ar">0</b></span></div>
<p style="color:var(--mut);margin:6px 0 0" id="hint"></p>
<script>
/*CORE*/
const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
function rayCrossings(p,poly){const xs=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];
 if((a[1]>p[1])!==(b[1]>p[1])){const x=a[0]+(p[1]-a[1])*(b[0]-a[0])/(b[1]-a[1]);if(x>p[0])xs.push(x)}}return xs}
function winding(p,poly){let w=0;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];
 if(a[1]<=p[1]){if(b[1]>p[1]&&cross(a,b,p)>0)w++}else if(b[1]<=p[1]&&cross(a,b,p)<0)w--}return w}
function dist(p,a,b){const L=Math.hypot(b[0]-a[0],b[1]-a[1]);return L===0?Math.hypot(p[0]-a[0],p[1]-a[1]):Math.abs(cross(a,b,p))/L}
function dp(pts,eps){if(pts.length<3)return pts.slice();let im=0,dm=0;
 for(let i=1;i<pts.length-1;i++){const d=dist(pts[i],pts[0],pts[pts.length-1]);if(d>dm){dm=d;im=i}}
 if(dm<=eps)return[pts[0],pts[pts.length-1]];const l=dp(pts.slice(0,im+1),eps),r=dp(pts.slice(im),eps);return l.slice(0,-1).concat(r)}
function hull(P){const pts=[...new Map(P.map(p=>[p[0]+','+p[1],p])).values()].sort((a,b)=>a[0]-b[0]||a[1]-b[1]);if(pts.length<3)return pts;
 const lo=[];for(const p of pts){while(lo.length>=2&&cross(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
 const up=[];for(const p of [...pts].reverse()){while(up.length>=2&&cross(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
 return lo.slice(0,-1).concat(up.slice(0,-1))}
function area(poly){let s=0;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];s+=a[0]*b[1]-b[0]*a[1]}return Math.abs(s/2)}
/*END*/
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id),W=1000,H=500;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let mode=1,cur=null,eps=12,line=[],P=[];
const star=[];for(let i=0;i<14;i++){const r=i%2?95:210,a=i*Math.PI/7-Math.PI/2;star.push([500+r*1.5*Math.cos(a),250+r*Math.sin(a)*1.05])}
function newLine(){line=[];let y=250;for(let x=20;x<=980;x+=4){y+=(Math.random()-.5)*22;y=Math.max(40,Math.min(460,y));line.push([x,y+30*Math.sin(x/90)])}}
function poly(a,close){ctx.beginPath();a.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));if(close)ctx.closePath()}
function draw(){ctx.clearRect(0,0,W,H);
 if(mode===1){poly(star,true);ctx.fillStyle=css('--card');ctx.fill();ctx.strokeStyle=css('--fg');ctx.lineWidth=2;ctx.stroke();
  if(cur){const xs=rayCrossings(cur,star),w=winding(cur,star),inside=xs.length%2===1;
   ctx.strokeStyle=css('--acc');ctx.lineWidth=1.5;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(cur[0],cur[1]);ctx.lineTo(W,cur[1]);ctx.stroke();ctx.setLineDash([]);
   ctx.fillStyle=css('--hit');xs.forEach(x=>{ctx.beginPath();ctx.arc(x,cur[1],5,0,7);ctx.fill()});
   ctx.fillStyle=css(inside?'--ok':'--hit');ctx.beginPath();ctx.arc(cur[0],cur[1],7,0,7);ctx.fill();
   $('cr').textContent=xs.length;$('wn').textContent=w;$('res').textContent=inside?'შიგნით':'გარეთ'}}
 if(mode===2){const s=dp(line,eps);poly(line);ctx.strokeStyle=css('--line');ctx.lineWidth=2;ctx.stroke();
  poly(s);ctx.strokeStyle=css('--hit');ctx.lineWidth=2.5;ctx.stroke();ctx.fillStyle=css('--hit');s.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],4,0,7);ctx.fill()});
  $('n0').textContent=line.length;$('n1').textContent=s.length;$('red').textContent=Math.round((1-s.length/line.length)*100)+'%'}
 if(mode===3){const h=hull(P);if(h.length>=3){poly(h,true);ctx.fillStyle=css('--acc');ctx.globalAlpha=.15;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=css('--acc');ctx.lineWidth=2.5;ctx.stroke()}
  ctx.fillStyle=css('--fg');P.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],3.5,0,7);ctx.fill()});
  ctx.fillStyle=css('--hit');h.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],5,0,7);ctx.fill()});
  $('np').textContent=P.length;$('nh').textContent=h.length;$('ar').textContent=Math.round(area(h)).toLocaleString('en')+' px²'}}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
cv.addEventListener('pointermove',e=>{if(mode===1){cur=pos(e);draw()}});
cv.addEventListener('pointerdown',e=>{if(mode===3){P.push(pos(e));draw()}});
const hints=['გადაატარეთ მაუსი: წყვეტილი სხივი მარჯვნივ მიდის. კენტი რაოდენობის გადაკვეთა ნიშნავს "შიგნით".','გადაწიეთ ε: რაც მეტია, მით ნაკლები წვეროა დარჩენილი. წითელი ხაზი არასოდეს გადაუხვევს ორიგინალს ε-ზე მეტად.','დააჭირეთ წერტილების დასამატებლად: წითელი წერტილები გარსის წვეროებია (Andrew-ს monotone chain).'];
function setMode(m){mode=m;cur=null;for(let i=1;i<=3;i++){$('m'+i).classList.toggle('on',i===m);$('s'+i).classList.toggle('hide',i!==m)}
 $('c2').classList.toggle('hide',m!==2);$('c3').classList.toggle('hide',m!==3);$('hint').textContent=hints[m-1];
 if(m===1){$('cr').textContent=$('wn').textContent=$('res').textContent='–'}draw()}
[1,2,3].forEach(i=>$('m'+i).onclick=()=>setMode(i));
$('eps').oninput=e=>{eps=+e.target.value;$('epsv').textContent=eps;draw()};
$('newline').onclick=()=>{newLine();draw()};
$('rnd').onclick=()=>{for(let i=0;i<30;i++){const a=Math.random()*7,r=Math.sqrt(Math.random())*200;P.push([500+Math.cos(a)*r*1.8,250+Math.sin(a)*r])}draw()};
$('clr').onclick=()=>{P=[];draw()};
function theme(){try{const t=parent.document.body.getAttribute('data-md-color-scheme');if(t)document.documentElement.dataset.theme=t==='slate'?'dark':'light'}catch(e){}draw()}
try{new MutationObserver(theme).observe(parent.document.body,{attributes:true,attributeFilter:['data-md-color-scheme']})}catch(e){}
newLine();setMode(1);theme();
</script></body></html>
